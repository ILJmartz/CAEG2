<style>
:root{
  --ink:#0D0F12; --graphite:#15181D; --graphite-2:#1C2026; --foot:#090B0D;
  --line-d:rgba(255,255,255,.12);
  --paper:#E7E9EB; --paper-line:#CBD0D5; --gray-l:#B7BDC5; --gray-d:#4B5159; --text:#111418; --muted:#5B6169; --muted-d:#A5ABB3; --soft-d:#C9CED5;
  --blue:#2F65A8; --blue-ink:#245391; --blue-soft:#7BA9E3;
  --display:"Playfair Display","Georgia","Times New Roman",serif;
  --body:"Manrope","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--ink);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;color:#fff;font-family:var(--body);font-weight:300;font-size:17px;line-height:1.65;
  background-color:var(--ink);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);
  background-size:7px 7px;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;}
img{max-width:100%;}
:focus-visible{outline:2px solid var(--blue-soft);outline-offset:3px;}
.light :focus-visible{outline-color:var(--blue);}
.container{max-width:1100px;margin:0 auto;padding:0 20px;}

/* ---------- cabeçalho flutuante ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding:12px 12px 0;}
.topbar-in{
  max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(13,15,18,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line-d);border-radius:999px;padding:7px 8px 7px 8px;
}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0 6px 0 0;cursor:pointer;color:#fff;text-align:left;flex:none;border-radius:999px;}
.brand img{width:46px;height:46px;border-radius:50%;display:block;background:#fff;flex:none;}
.brand-txt{display:flex;flex-direction:column;line-height:1.05;}
.brand-txt b{font-family:var(--display);font-weight:900;font-size:1.3rem;letter-spacing:.06em;}
.brand-txt small{font-size:.72rem;color:var(--muted-d);font-weight:300;}
.tabs{display:flex;gap:2px;}
.tab{background:none;border:0;color:var(--muted-d);padding:11px 16px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:400;white-space:nowrap;transition:background .15s,color .15s;}
.tab:hover{color:#fff;background:rgba(255,255,255,.07);}
.tab[aria-current=page]{color:#fff;background:rgba(255,255,255,.14);}
@media (max-width:759px){
  .topbar{padding:8px 8px 0;}
  .topbar-in{gap:4px;border-radius:26px;}
  .brand{padding:0 2px 0 0;}
  .brand img{width:40px;height:40px;}
  .brand-txt{display:none;}
  .tabs{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
  .tab{white-space:normal;text-align:center;padding:8px 3px;font-size:.74rem;line-height:1.15;border-radius:16px;}
}

/* ---------- hero ---------- */
.hero{position:relative;padding:44px 0 0;background:radial-gradient(900px 420px at 88% 8%,rgba(255,255,255,.055),transparent 70%);}
.hero-logo{width:clamp(128px,34vw,190px);height:auto;aspect-ratio:1;border-radius:50%;display:block;background:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 0 7px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.55);}
.hero-title,.page-title{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.92;margin:0;letter-spacing:.005em;}
.hero-title{font-size:clamp(2.3rem,10.4vw,6.2rem);margin:30px 0 22px;}
.page-title{font-size:clamp(2.4rem,10.5vw,4.8rem);margin:0 0 18px;}
.hero-title span{display:block;}
.hero-title .b{color:var(--gray-l);}
.hero-title .o{font-style:italic;color:transparent;-webkit-text-stroke:1.6px #fff;}
.hero-lead{color:var(--muted-d);font-size:clamp(1.05rem,3.6vw,1.3rem);max-width:34em;margin:0;}
.hero .eyebrow{color:var(--gray-l);}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;}
@media (min-width:900px){
  .hero-home .container{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;column-gap:48px;}
  .hero-home .hero-text{grid-column:1;grid-row:1;}
  .hero-home .hero-logo{grid-column:2;grid-row:1;width:min(100%,340px);justify-self:center;}
  .hero-home .hero-title{margin-top:0;font-size:clamp(3rem,5.5vw,5rem);}
}
.trees{display:block;width:100%;height:150px;margin-top:30px;line-height:0;overflow:hidden;}
.trees svg{width:100%;height:150px;display:block;}
.t1{fill:#1A1D22;} .t2{fill:#2C3138;} .t3{fill:var(--paper);}
.mk1{fill:#454B54;} .mk2{fill:#394048;} .mk3{fill:#454B54;} .mk4{fill:#383E46;}
.estf{fill:#0F1215;} .estt{fill:#B4BBC5;stroke:#B4BBC5;stroke-width:.4;stroke-linejoin:round;fill-rule:evenodd;}
.cabo{stroke:#7C838C;stroke-width:1;fill:none;} .cabine{fill:#A6ACB4;}

.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;font-family:var(--body);font-weight:500;
  text-transform:uppercase;letter-spacing:.05em;font-size:.86rem;line-height:1;text-decoration:none;cursor:pointer;border:1px solid transparent;
  transition:filter .15s,border-color .15s;color:#fff;}
.pill .ic svg{width:18px;height:18px;}
.pill-fill{background:#F1F2F4;color:#0D0F12;}
.pill-fill:hover{background:#fff;}
.pill-line{background:transparent;border-color:rgba(255,255,255,.3);}
.pill-line:hover{border-color:#fff;}
.pill-lg{padding:26px 34px;font-size:clamp(.95rem,3.6vw,1.15rem);}
.pill-lg .ic svg{width:24px;height:24px;}
.ic{display:inline-flex;}

/* ---------- seções claras ---------- */
.light{background:var(--paper);color:var(--text);padding:54px 0 76px;margin-top:-1px;}
.eyebrow{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.34em;font-size:.86rem;color:var(--gray-d);margin:0 0 12px;}
.h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.98;font-size:clamp(2rem,7.6vw,3.6rem);margin:0 0 28px;color:var(--text);}
.text{color:var(--muted);font-size:clamp(1.05rem,3.4vw,1.22rem);max-width:40em;margin:0 0 30px;white-space:pre-line;}
.empty{border:1px dashed #B9BEC5;border-radius:18px;padding:44px 20px;text-align:center;color:var(--muted);}
.link-url{display:block;margin-top:6px;word-break:break-all;user-select:all;color:var(--text);font-weight:400;text-decoration:underline;}

/* ---------- notícias ---------- */
.ncards{display:grid;gap:20px;grid-template-columns:1fr;}
@media (min-width:900px){.ncards{grid-template-columns:repeat(2,1fr);}}
.ncard{position:relative;overflow:hidden;background:var(--graphite);color:#fff;border:1px solid var(--line-d);border-radius:22px;padding:28px 24px 26px;display:flex;flex-direction:column;}
.ncard>*{position:relative;}
.ncard>.ghost{position:absolute;top:-14px;right:14px;font-family:var(--display);font-weight:900;font-size:9rem;line-height:1;color:rgba(255,255,255,.05);pointer-events:none;}
.ncard-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:14px;padding:9px 14px;min-width:64px;font-family:var(--display);font-weight:900;line-height:1;}
.badge b{font-size:2rem;font-weight:900;}
.badge small{font-size:.82rem;letter-spacing:.1em;margin-top:2px;}
.pilltag{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft-d);font-weight:500;line-height:1.1;}
.ncard h3{font-family:var(--display);font-weight:800;font-size:clamp(1.55rem,5vw,1.9rem);line-height:1.08;margin:0 0 10px;overflow-wrap:anywhere;}
.when{display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--gray-l);font-weight:400;font-size:.95rem;margin:0 0 16px;}
.nimg{display:block;width:100%;padding:0;border:1px solid var(--line-d);border-radius:14px;overflow:hidden;background:#0E1013;cursor:zoom-in;margin:2px 0 16px;}
.nimg img{display:block;width:100%;max-height:420px;object-fit:contain;}
.ncard .t{color:var(--soft-d);margin:0;white-space:pre-line;overflow-wrap:anywhere;}
.ncard-act{margin-top:20px;}
.ncard .pub{margin:auto 0 0;padding-top:18px;font-size:.8rem;color:var(--muted-d);}
.more{display:flex;justify-content:center;margin-top:26px;}
.more .pill-line{color:var(--text);border-color:#B9BEC5;}
.more .pill-line:hover{border-color:var(--text);}

/* ---------- produtos ---------- */
.pgrid{display:grid;gap:22px;grid-template-columns:1fr;}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(2,1fr);}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(3,1fr);}}
.pcard{background:var(--graphite);border:1px solid var(--line-d);border-radius:22px;padding:14px;display:flex;flex-direction:column;color:#fff;}
.pimg{position:relative;display:block;width:100%;aspect-ratio:1/1;border:0;padding:0;border-radius:14px;overflow:hidden;background:#E8EBEE;cursor:zoom-in;}
.pimg img{width:100%;height:100%;object-fit:contain;display:block;}
.pph{display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--graphite-2);color:var(--gray-l);font-family:var(--display);font-weight:900;font-size:5rem;}
.ptag{position:absolute;top:12px;left:12px;background:rgba(21,24,29,.88);color:var(--gray-l);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.82rem;text-transform:uppercase;line-height:1;}
.pbody{padding:22px 10px 10px;display:flex;flex-direction:column;flex:1;}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,6vw,2rem);line-height:1;text-transform:uppercase;margin:0 0 10px;overflow-wrap:anywhere;}
.pdesc{color:var(--soft-d);margin:0 0 18px;white-space:pre-line;overflow-wrap:anywhere;}
.pgrow{flex:1;}
.plabel{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d);margin:0;font-weight:400;}
.pprice{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,9vw,3.2rem);line-height:1;color:#fff;margin:2px 0 0;}

/* ---------- membros ---------- */
.mgrid{display:grid;gap:18px;grid-template-columns:1fr;}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(2,1fr);}}
@media (min-width:900px){.mgrid{grid-template-columns:repeat(3,1fr);}}
.mcard{background:#fff;border:1px solid var(--paper-line);border-radius:22px;padding:30px 22px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.avatar{width:136px;height:136px;border-radius:50%;padding:6px;border:1.5px solid #3A4047;display:grid;place-items:center;overflow:hidden;flex:none;}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.initials{width:100%;height:100%;border-radius:50%;background:#E3E6E9;color:#2B3036;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:2.5rem;}
.mname{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;text-transform:uppercase;margin:20px 0 8px;color:var(--text);overflow-wrap:anywhere;}
.mrole{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.88rem;color:var(--gray-d);margin:0;}
.mcourse{margin:6px 0 0;color:var(--muted);font-size:.9rem;}
.mbio{margin:14px 0 0;color:#3E444B;font-size:.95rem;overflow-wrap:anywhere;}
.mcontact{margin:12px 0 0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere;}

/* ---------- rodapé ---------- */
.footer{background:var(--foot);border-top:1px solid var(--line-d);padding:56px 0 34px;}
.fgrid{display:grid;gap:38px;grid-template-columns:1fr;}
@media (min-width:800px){.fgrid{grid-template-columns:1.5fr 1fr 1fr;gap:48px;}}
.fbrand{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.fbrand img{width:64px;height:64px;border-radius:50%;background:#fff;display:block;flex:none;}
.fname{font-family:var(--display);font-weight:900;font-size:1.45rem;line-height:1;text-transform:uppercase;}
.fdesc{color:var(--muted-d);margin:0;max-width:30em;font-size:.98rem;}
.fh{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.3em;font-size:.84rem;color:var(--gray-l);margin:0 0 18px;}
.flinks{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
.flink{background:none;border:0;padding:4px 0;color:var(--soft-d);cursor:pointer;font-size:1.05rem;text-align:left;}
.flink:hover{color:#fff;}
.addr{color:var(--soft-d);margin:0;}
.addr span{display:block;}
.redes{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
.redes .pill{padding:11px 18px;font-size:.74rem;}
.copy{border-top:1px solid var(--line-d);margin-top:40px;padding-top:22px;color:var(--muted-d);font-size:.84rem;}

/* ---------- imagem ampliada ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:80;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);}
.lb{position:relative;max-width:min(1000px,100%);max-height:100%;display:flex;}
.lb img{max-width:100%;max-height:calc(100vh - 48px);object-fit:contain;border-radius:12px;background:#fff;display:block;}
.lb-close{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;display:grid;place-items:center;}
.lb-close .ic svg{width:22px;height:22px;}

/* ---------- movimento ---------- */
.view{animation:entrar .45s ease both;}
@keyframes entrar{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.view{animation:none;} *{transition:none !important;}}

/* ---------- tipografia: títulos em serifa (Playfair Display) e textos em Manrope ---------- */
body{font-weight:400;}
.hero-title,.page-title,.h2,.ncard h3,.pname,.mname,.fname,.brand-txt b,.badge,.pprice,.ghost,.initials,.pph{font-family:var(--display);font-variant-numeric:lining-nums;text-transform:none;}
.hero-title{font-weight:800;line-height:1.02;letter-spacing:-.015em;}
.hero-title .o{font-style:italic;font-weight:500;color:#fff;-webkit-text-stroke:0;}
.page-title{font-weight:800;line-height:1.04;letter-spacing:-.01em;}
.h2{font-weight:700;line-height:1.08;letter-spacing:-.01em;}
.ncard h3,.pname,.mname,.fname{font-weight:700;line-height:1.12;letter-spacing:-.005em;}
.brand-txt b{font-weight:800;letter-spacing:.05em;}
.badge b,.pprice{font-weight:700;}
.eyebrow,.mrole,.fh,.ptag{font-family:var(--body);font-weight:700;letter-spacing:.22em;text-transform:uppercase;}
.eyebrow,.mrole{font-size:.78rem;} .fh{font-size:.76rem;} .ptag{font-size:.72rem;}
.pill{font-weight:700;letter-spacing:.06em;}
.hero-lead,.text{font-weight:400;}
</style>

  else { corpo = h('div', { class: 'pgrid' }); ps.forEach(function(p){ corpo.append(produtoEl(p)); }); }
  v.append(secao(corpo));
  return v;
}

/* ---------- Quem somos nós? ---------- */
function iniciais(nome){
  var p = String(nome || '').trim().split(/\s+/).filter(Boolean);
  var s = p.length ? p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '') : '?';
  return h('span', { class: 'initials', 'aria-hidden': 'true' }, s.toUpperCase());
}
function membroEl(m){
  var src = imgSrc(m.foto);
  var av = h('div', { class: 'avatar' });
  if (src){
    av.append(h('img', { src: src, alt: 'Foto de ' + (m.nome || 'membro'), loading: 'lazy',
      onerror: function(e){ var img = e.target; var pai = img.parentNode; img.remove(); if (pai) pai.append(iniciais(m.nome)); } }));
  } else av.append(iniciais(m.nome));
  return h('article', { class: 'mcard' }, av,
    h('h3', { class: 'mname' }, m.nome || ''),
    m.cargo ? h('p', { class: 'mrole' }, m.cargo) : null,
    m.curso ? h('p', { class: 'mcourse' }, m.curso) : null,
    m.bio ? h('p', { class: 'mbio' }, m.bio) : null,
    m.contato ? h('p', { class: 'mcontact' }, m.contato) : null);
}
function viewQuem(){
  var v = h('div', { class: 'view' });
  v.append(heroPagina('Sobre o CAEG', 'Quem somos nós?', ''));
  var ms = lista(CONTEUDO.membros);
  var corpo;
  if (!ms.length) corpo = vazio('Os membros serão apresentados aqui em breve.');
  else { corpo = h('div', { class: 'mgrid' }); ms.forEach(function(m){ corpo.append(membroEl(m)); }); }
  v.append(secao(
    CONTEUDO.sobre ? h('p', { class: 'text' }, CONTEUDO.sobre) : null,
    h('p', { class: 'eyebrow' }, 'Nossa equipe'), h('h2', { class: 'h2' }, 'Membros'), corpo));
  return v;
}

/* ---------- rodapé ---------- */
function renderFooter(){
  var r = CONTEUDO.rodape || {};
  var redes = lista(r.redes).filter(function(x){ return x && x.nome && safeUrl(x.url); });
  var linhas = String(r.endereco || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  var nomes = { inicio: 'Início', drive: 'Drive de Estudos', produtos: 'Produtos', quem: 'Quem somos nós?' };
  var nav = h('ul', { class: 'flinks' }, Object.keys(nomes).map(function(k){
    return h('li', {}, h('button', { class: 'flink', type: 'button', onclick: function(){ go(k); } }, nomes[k]));
  }));
  $footer.replaceChildren(h('div', { class: 'container' },
    h('div', { class: 'fgrid' },
      h('div', {},
        h('div', { class: 'fbrand' }, h('img', { src: LOGO, alt: '', width: 64, height: 64 }), h('span', { class: 'fname' }, 'Centro Acadêmico Eugênio Gudin')),
        CONTEUDO.slogan ? h('p', { class: 'fdesc' }, CONTEUDO.slogan) : null),
      h('div', {}, h('h2', { class: 'fh' }, 'Navegação'), nav),
      (linhas.length || redes.length) ? h('div', {},
        linhas.length ? h('h2', { class: 'fh' }, 'Onde nos achar') : h('h2', { class: 'fh' }, 'Redes'),
        linhas.length ? h('p', { class: 'addr' }, linhas.map(function(l){ return h('span', {}, l); })) : null,
        redes.length ? h('div', { class: 'redes' }, redes.map(function(x){ return pill(x.nome, 'line', null, safeUrl(x.url)); })) : null) : null),
    h('p', { class: 'copy' }, '© ' + new Date().getFullYear() + ' Centro Acadêmico Eugênio Gudin, Fundação Getulio Vargas.')));
}

/* ---------- montagem ---------- */
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    if (b.getAttribute('data-tab') === route) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var v = route === 'drive' ? viewDrive() : route === 'produtos' ? viewProdutos() : route === 'quem' ? viewQuem() : viewInicio();
  $app.replaceChildren(v);
}
Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-tab')); });
});
window.addEventListener('hashchange', function(){ route = parseHash(); render(); window.scrollTo(0, 0); });
function start(){ route = parseHash(); render(); renderFooter(); }
/* espera o arquivo inteiro carregar, para as IMAGENS (no fim) já existirem */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
